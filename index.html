<style>
/* Layout: mobile-first. Fixed bottom tab bar, one column, big tap targets. Desktop just centres the column at 640px. */
:root {
  --bg: #f1f4f7; --surface: #ffffff; --fg: #142029; --muted: #5f6e7a; --line: #d3dce2; --accent: #1e5a8a; --accent-soft: #e3edf6;

:root[data-theme="dark"] {
  --bg: #0f161e; --surface: #182230; --fg: #e6ecf2; --muted: #93a3b4; --line: #2b3949; --accent: #7cb8e8; --accent-soft: #1d3247;
  --good: #52c58a; --good-soft: #173426; --bad: #e57b7b; --bad-soft: #3d1f1f; --warn-soft: #3a3118; --note-soft: #2d2a16; color-scheme: dark }
:root[data-force="dark"] {
  --bg: #0f161e; --surface: #182230; --fg: #e6ecf2; --muted: #93a3b4; --line: #2b3949; --accent: #7cb8e8; --accent-soft: #1d3247;
  --good: #52c58a; --good-soft: #173426; --bad: #e57b7b; --bad-soft: #3d1f1f; --warn-soft: #3a3118; --note-soft: #2d2a16; color-scheme: dark }
:root[data-force="light"] {
  --bg: #f1f4f7; --surface: #ffffff; --fg: #142029; --muted: #5f6e7a; --line: #d3dce2; --accent: #1e5a8a; --accent-soft: #e3edf6;

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent }

.top { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5 }

nav.bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); z-index: 6; padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)) }

/* read toolbar: pinned search row, save-as-group beside it, toggle buttons */
.sticky { position: sticky; z-index: 4; background: var(--bg); padding: 14px 16px 10px; margin: -14px -16px 0; display: flex; gap: 8px; align-items: center }

.tg.hide { flex: 1.6 }

.stack { display: flex; flex-direction: column; gap: 12px }
h2 { font-size: 1rem; margin: 0 0 8px; font-weight: 700 }
.hint { color: var(--muted); font-size: .88rem; margin: 0 }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface) }
.seg button { border: 0; background: none; padding: 11px 6px; font-weight: 500; font-size: .95rem }
.seg.sm button { padding: 8px 6px; font-size: .85rem }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff }
.chips { display: flex; flex-wrap: wrap; gap: 8px }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-size: .92rem; display: inline-flex; gap: 6px; align-items: baseline; min-height: 40px }
.chip .n { color: var(--muted); font-size: .8rem }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff } .chip[aria-pressed="true"] .n { color: rgba(255,255,255,.8) }
.search { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; min-height: 46px }

.search button { border: 0; background: none; color: var(--muted); padding: 6px }

.q { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; min-width: 0 }

.qh .num { color: var(--accent); font-weight: 700 }
.qt { font-weight: 600; font-size: 1.05rem; line-height: 1.45; margin: 0 0 12px; overflow-wrap: anywhere }
.opts { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none }
.opt { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); text-align: left; width: 100%; line-height: 1.4; overflow-wrap: anywhere; min-height: 48px; font-size: 1rem }
.opt .let { flex: none; width: 1.8em; height: 1.8em; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; font-size: .82rem; color: var(--muted) }
.opt.sel { border-color: var(--accent); background: var(--accent-soft) } .opt.sel .let { background: var(--accent); border-color: var(--accent); color: #fff }
.opt.ok { background: var(--good-soft); border-color: var(--good) } .opt.ok .let { background: var(--good); border-color: var(--good); color: #fff }
.opt.bad { background: var(--bad-soft); border-color: var(--bad) } .opt.bad .let { background: var(--bad); border-color: var(--bad); color: #fff }
.opt:disabled { cursor: default }
mark { background: var(--warn-soft); color: inherit; border-radius: 3px; padding: 0 2px }
.reveal { margin-top: 10px; width: 100% }
.verdict { font-weight: 700 } .verdict.good { color: var(--good) } .verdict.bad { color: var(--bad) }

.tools { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap }

.tools .ib.has { border-color: var(--accent); color: var(--accent) }
.note { margin-top: 10px; background: var(--note-soft); border-radius: 10px; padding: 10px 12px; font-size: .95rem; white-space: pre-wrap; overflow-wrap: anywhere }
.panel { margin-top: 10px; border: 1px solid var(--line); border-radius: 12px; padding: 12px }

.sticky-next { position: sticky; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 10px); margin-top: 12px }
.prog { display: flex; gap: 12px; align-items: center; font-size: .85rem; color: var(--muted); margin-bottom: 8px }
.prog b { color: var(--fg) }
.pbar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 12px }
.pbar i { display: block; height: 100%; background: var(--accent); width: 0 }
.grid { display: flex; flex-wrap: wrap; gap: 6px }
.grid button { width: 40px; height: 36px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: .85rem; padding: 0 }
.grid button.done { background: var(--accent-soft); border-color: var(--accent) } .grid button.cur { outline: 2px solid var(--accent); outline-offset: 1px }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px }

.md p { margin: 0 0 8px } .md p:last-child, .md ul:last-child, .md ol:last-child { margin-bottom: 0 }

.msg.me { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px }
.msg.ai { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 4px }

.composer { position: sticky; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 8px); display: flex; gap: 8px; align-items: flex-end; background: var(--bg); padding-top: 8px }
.composer textarea { min-height: 46px; max-height: 160px; flex: 1 }
.toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 14px); transform: translate(-50%, 8px); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: .92rem; opacity: 0; pointer-events: none; z-index: 7; max-width: calc(100vw - 32px); text-align: center }
.toast.show { opacity: 1; transform: translate(-50%, 0) }
/* motion: every piece confirms a tap, runs under 250ms, and is off under reduce-motion */
@media (prefers-reduced-motion: no-preference) {
  .opt { transition: background .15s, border-color .15s, transform .18s cubic-bezier(.2,.8,.2,1) }
  .opt .let { transition: background .15s, border-color .15s, color .15s }
  .opt.pop { animation: pop .22s cubic-bezier(.2,.8,.2,1) }
  .opt.nudge { animation: nudge .26s ease-out }
  .verdict.rise { animation: rise .18s ease-out }
  .btn:active:not(:disabled), .ib:active:not(:disabled), .tg:active, .chip:active, .opt.pick:active { transform: scale(.97); transition-duration: .06s }
  nav.bar button i { transition: background .18s }
  .toast { transition: opacity .18s, transform .18s }
  .page.swap { animation: fade .14s ease-out }
  .ring .arc { transition: stroke-dashoffset .7s cubic-bezier(.2,.8,.2,1) }
  .pbar i { transition: width .3s }
  @keyframes pop { 0% { transform: scale(1) } 40% { transform: scale(1.025) } 100% { transform: scale(1) } }

  @keyframes rise { from { opacity: 0; transform: translateY(4px) } to { opacity: 1; transform: none } }
  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
}

  // minimal Markdown to HTML for AI replies: paragraphs, bullets, numbered lists, headings, bold, italic, code
  function md(src) {

  async function runSample(input, outEl, onDone) {

      stop.hidden = true; (U.ai[q.n] = U.ai[q.n] || []).push({ q: label, a: text, at: Date.now() }); if (U.ai[q.n].length > 6) U.ai[q.n].shift(); dirty('ai');

  function struggled() { return BANK.filter(q => (U.wrong[q.n] || 0) > 0).sort((a, b) => ((U.wrong[b.n] || 0) - (U.right[b.n] || 0)) - ((U.wrong[a.n] || 0) - (U.right[a.n] || 0)) || (U.wrong[b.n] || 0) - (U.wrong[a.n] || 0)) }
  function digest() {
    const qs = struggled().slice(0, 25);
    const byT = {}; BANK.forEach(q => { const r = byT[q.t] || (byT[q.t] = [0, 0]); r[0] += U.right[q.n] || 0; r[1] += U.wrong[q.n] || 0 });

  function startTest(p, label) {

  function renderTestLive(pg) {

  function finishTest() {

  function renderTestResult(pg) {
    const qs = test.ids.map(n => byN.get(n)); const wrong = qs.filter(q => test.picks[q.n] !== q.ans);
    const r = 48, C = 2 * Math.PI * r;
    pg.innerHTML = `<div class="stack"><div class="card">
      <svg class="ring" viewBox="0 0 120 120" role="img" aria-label="${T().result} ${test.score}%"><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--line)" stroke-width="10"/><circle class="arc" id="arc" cx="60" cy="60" r="${r}" fill="none" stroke="${test.score >= 70 ? 'var(--good)' : 'var(--bad)'}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C} ${C}" stroke-dashoffset="${test.counted ? C * (1 - test.score / 100) : C}" transform="rotate(-90 60 60)"/><text x="60" y="68" text-anchor="middle" font-size="26" font-weight="700" id="pct">${test.counted ? test.score : 0}%</text></svg>
      <div class="tiles" style="margin-top:12px"><div class="tile">${T().correct}<b class="g" data-count="${qs.length - wrong.length}">${test.counted ? qs.length - wrong.length : 0}</b></div><div class="tile">${T().wrong}<b class="r" data-count="${wrong.length}">${test.counted ? wrong.length : 0}</b></div><div class="tile">${T().total}<b data-count="${qs.length}">${test.counted ? qs.length : 0}</b></div></div>
      <div class="row" style="margin-top:12px">${wrong.length ? `<button class="btn primary" type="button" id="retry" style="flex:1">${T().repeatWrong}</button><button class="btn" type="button" id="wg">${T().wrongToGroup}</button>` : ''}<button class="btn" type="button" id="newt" style="flex:1">${T().newTest}</button></div><div id="wgbox"></div></div>
      <div class="row" style="justify-content:space-between"><h2 style="margin:0">${T().review}</h2><button class="btn sm" type="button" id="tw">${test.onlyWrong ? T().all : T().onlyWrong}</button></div>
      <div class="stack" id="rev"></div></div>`;
    if (!test.counted) {   // once per test: the ring sweeps to the score and the numbers count up with it
      test.counted = true; const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches, dur = reduced ? 0 : 700, t0 = performance.now();
      requestAnimationFrame(() => { const a = $('arc'); if (a) a.style.strokeDashoffset = C * (1 - test.score / 100) });
      const counts = [...pg.querySelectorAll('[data-count]')], pct = $('pct');
      const step = now => { const k = dur ? Math.min(1, (now - t0) / dur) : 1, e = 1 - Math.pow(1 - k, 3); if (pct) pct.textContent = Math.round(test.score * e) + '%'; counts.forEach(c => c.textContent = Math.round(+c.dataset.count * e)); if (k < 1 && pct && pct.isConnected) requestAnimationFrame(step) };
      requestAnimationFrame(step);
    }
    const rev = $('rev'); const list = qs.filter(q => !test.onlyWrong || test.picks[q.n] !== q.ans);
    if (!list.length) rev.innerHTML = `<p class="empty">${T().noWrong}</p>`;
    list.forEach(q => rev.appendChild(qCard(q, { mode: 'review', picked: test.picks[q.n] })));
    $('tw').onclick = () => { test.onlyWrong = !test.onlyWrong; renderTestResult(pg) };
    $('newt').onclick = () => { test = null; render() };
    if ($('retry')) $('retry').onclick = () => { const keep = P().count; P().count = 'all'; startTest(wrong, T().mistakes); P().count = keep };
    if ($('wg')) $('wg').onclick = () => { $('wgbox').innerHTML = `<div class="panel"><div class="row"><input class="txt" type="text" id="wgn" value="${T().mistakes} · ${fmtDate(Date.now())}" style="flex:1;min-width:0"><button class="btn sm primary" type="button" id="wgok">${T().create}</button></div></div>`;
      $('wgok').onclick = () => { const g = createGroup($('wgn').value, '', 'all'); g.ids = wrong.map(q => q.n); dirty('groups'); toast(T().toastGroup(g.name)); $('wgbox').innerHTML = `<p class="hint" style="margin-top:8px">${esc(T().groupCreated(g.name, g.ids.length))}</p>` } };
  }

  /* ---------- MISTAKES ---------- */
  function mistakes() { return BANK.filter(q => (U.wrong[q.n] || 0) > 0).sort((a, b) => (U.wrong[b.n] - (U.right[b.n] || 0)) - (U.wrong[a.n] - (U.right[a.n] || 0))) }
  function renderMist(pg) {
    const items = mistakes().filter(inFilter);
    const nAll = struggled().length;
    pg.innerHTML = `<div class="stack">
      ${NO_AI ? '' : `<div class="card"><h2>${T().aiDiscuss}</h2><p class="hint" style="margin-bottom:10px">${sampleFn ? T().aiDiscussHint : T().aiUnavailable}</p>
        <div class="row">${sampleFn ? `<button class="btn primary" type="button" id="aid" style="flex:1" ${nAll ? '' : 'disabled'}>${U.aiChat ? T().aiContinue : T().aiStart}</button>` : ''}<button class="btn" type="button" id="cpd" ${nAll ? '' : 'disabled'}>${T().copyDigest}</button></div></div>`}
      <p class="hint">${T().mistHint}</p>
      ${items.length ? `<div class="row"><button class="btn primary" type="button" id="mt" style="flex:1">${T().testMist} · ${items.length}</button><button class="btn" type="button" id="mc">${T().clearList}</button></div><div id="cbox"></div>` : ''}
      <div class="stack" id="ml">${items.length ? '' : `<p class="empty">${T().noMist}</p>`}</div></div>`;
    const ml = $('ml'); items.slice(0, 50).forEach(q => ml.appendChild(qCard(q, { mode: P().hide ? 'hidden' : 'read' })));
    if (items.length > 50) ml.insertAdjacentHTML('beforeend', `<p class="hint">${T().showing50(items.length)}</p>`);
    if ($('aid')) $('aid').onclick = () => go('ai');
    if ($('cpd')) $('cpd').onclick = e => copyText(digest(), e.currentTarget);
    if ($('mt')) $('mt').onclick = () => { const keep = P().count; P().count = 'all'; startTest(items, T().mistakes); P().count = keep };
    if ($('mc')) $('mc').onclick = () => { $('cbox').innerHTML = `<div class="confirm">${T().clearMistQ(items.length)} <button class="btn danger" type="button" id="yes">${T().del}</button><button class="btn" type="button" id="no">${T().no}</button></div>`; $('yes').onclick = () => { items.forEach(q => { delete U.wrong[q.n] }); dirty('answers'); render() }; $('no').onclick = () => { $('cbox').innerHTML = '' } };
  }

  /* ---------- STATS ---------- */
  function renderStats(pg) {
    const seen = BANK.filter(q => U.right[q.n] || U.wrong[q.n]); const okN = seen.filter(q => (U.right[q.n] || 0) > (U.wrong[q.n] || 0)).length;
    const tot = Object.values(U.right).reduce((a, b) => a + b, 0), totW = Object.values(U.wrong).reduce((a, b) => a + b, 0);
    const byT = {}; BANK.forEach(q => { const r = byT[q.t] || (byT[q.t] = { n: 0, seen: 0, ok: 0, w: 0 }); r.n++; const rr = U.right[q.n] || 0, ww = U.wrong[q.n] || 0; if (rr || ww) r.seen++; r.ok += rr; r.w += ww });
    const rows = Object.entries(byT).sort((a, b) => b[1].n - a[1].n);
    const notes = Object.keys(U.notes).filter(n => byN.has(+n));
    pg.innerHTML = `<div class="stack">
      <div class="tiles"><div class="tile">${T().seen}<b>${seen.length}</b>${T().of(BANK.length)}</div><div class="tile">${T().lastCorrect}<b class="g">${okN}</b></div><div class="tile">${T().totalAnswers}<b>${tot + totW}</b>${T().accuracy(tot + totW ? Math.round(tot / (tot + totW) * 100) : 0)}</div><div class="tile">${T().tests}<b>${U.history.length}</b>${U.history.length ? T().best(Math.max(...U.history.map(h => h.score))) : ''}</div><div class="tile">${T().notes}<b>${notes.length}</b></div><div class="tile">${T().groups}<b>${U.groups.length}</b></div></div>
      ${notes.length ? `<div class="card"><h2>${T().withNotes}</h2><div class="stack" id="nl"></div></div>` : ''}
      <div class="card"><h2>${T().byTopic}</h2>${rows.map(([t, r]) => `<div style="padding:8px 0;border-top:1px solid var(--line)"><div class="mist"><span style="font-size:.92rem">${esc(t)}</span><span class="hint">${T().seenOf(r.seen, r.n)}${r.ok + r.w ? ' · ' + Math.round(r.ok / (r.ok + r.w) * 100) + '%' : ''}</span></div><div class="pbar" style="margin:6px 0 0"><i style="width:${r.seen / r.n * 100}%;background:${r.ok + r.w && r.ok / (r.ok + r.w) < .7 ? 'var(--bad)' : 'var(--accent)'}"></i></div></div>`).join('')}</div>
      <div class="card"><h2>${T().data}</h2><p class="hint" style="margin-bottom:10px">${store.mode === 'cloud' ? T().dataCloud : T().dataLocal}</p><button class="btn danger" type="button" id="reset">${T().resetAnswers}</button><div id="rbox"></div></div></div>`;
    if ($('nl')) notes.slice(0, 50).map(n => byN.get(+n)).forEach(q => $('nl').appendChild(qCard(q, { mode: 'read' })));
    $('reset').onclick = () => { $('rbox').innerHTML = `<div class="confirm" style="margin-top:10px">${T().resetQ} <button class="btn danger" type="button" id="yes">${T().yes}</button><button class="btn" type="button" id="no">${T().no}</button></div>`; $('yes').onclick = () => { U.wrong = {}; U.right = {}; U.history = []; dirty('answers'); dirty('history'); flush(); render() }; $('no').onclick = () => { $('rbox').innerHTML = '' } };
  }

  /* ---------- keyboard (desktop) ---------- */
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA' || !test || test.done || view !== 'test') return;
    const q = byN.get(test.ids[test.cur]); const k = parseInt(e.key, 10);
    if (k >= 1 && k <= q.opts.length) { const b = document.querySelector(`#qbox .opt[data-i="${k - 1}"]`); if (b && b.tagName === 'BUTTON') b.click() }
    else if (e.key === 'Enter' || e.key === 'ArrowRight') { const n = $('next'); if (n) n.click() }
    else if (e.key === 'ArrowLeft') { const p = $('prev'); if (p && !p.disabled) p.click() }
  });

  /* ---------- boot ---------- */
  fetch('bank.json').then(r => { if (!r.ok) throw new Error(r.status); return r.json() }).then(async data => {
    BANK = data; BANK.forEach(q => byN.set(q.n, q));
    const tc = {}; BANK.forEach(q => tc[q.t] = (tc[q.t] || 0) + 1); topics = Object.keys(tc).sort((a, b) => tc[b] - tc[a]);
    await Promise.all([initStore(), (window.claude && claude.use ? claude.use('sample').catch(() => null) : Promise.resolve(null)).then(s => { sampleFn = s })]);
    render();
  }).catch(err => { $('page').innerHTML = `<p class="empty">${T().loadErr} (${esc(err.message)}). ${T().reload}</p>` });
})();
</script>

<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}) });
}
</script>
</body>
