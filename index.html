<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e5a8a" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#182230" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="შინაგანი მედიცინის რეზიდენტურის საგამოცდო ტესტები: კითხვა, ტესტი, შეცდომები, სტატისტიკა.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px) }
body { margin: 0; font: 14px system-ui, sans-serif }
img { max-width: 100% }
[hidden] { display: none !important }
</style>
<title>რეზიდენტურის ტესტები</title>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700&display=swap">
<style>
/* Layout: mobile-first. Fixed bottom tab bar, one column, big tap targets. Desktop just centres the column at 640px. */
:root {
  --bg: #f1f4f7; --surface: #ffffff; --fg: #142029; --muted: #5f6e7a; --line: #d3dce2; --accent: #1e5a8a; --accent-soft: #e3edf6;
  --good: #1b7a4b; --good-soft: #e2f3e9; --bad: #b23b3b; --bad-soft: #f9e5e5; --warn-soft: #fff2d1;
  --body: "Noto Sans Georgian", "Noto Sans", "Helvetica Neue", Arial, sans-serif;
  --nav-h: 60px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f161e; --surface: #182230; --fg: #e6ecf2; --muted: #93a3b4; --line: #2b3949; --accent: #7cb8e8; --accent-soft: #1d3247;
  --good: #52c58a; --good-soft: #173426; --bad: #e57b7b; --bad-soft: #3d1f1f; --warn-soft: #3a3118; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f161e; --surface: #182230; --fg: #e6ecf2; --muted: #93a3b4; --line: #2b3949; --accent: #7cb8e8; --accent-soft: #1d3247;
  --good: #52c58a; --good-soft: #173426; --bad: #e57b7b; --bad-soft: #3d1f1f; --warn-soft: #3a3118; color-scheme: dark }

:root[data-force="dark"] {
  --bg: #0f161e; --surface: #182230; --fg: #e6ecf2; --muted: #93a3b4; --line: #2b3949; --accent: #7cb8e8; --accent-soft: #1d3247;
  --good: #52c58a; --good-soft: #173426; --bad: #e57b7b; --bad-soft: #3d1f1f; --warn-soft: #3a3118; color-scheme: dark }
:root[data-force="light"] {
  --bg: #f1f4f7; --surface: #ffffff; --fg: #142029; --muted: #5f6e7a; --line: #d3dce2; --accent: #1e5a8a; --accent-soft: #e3edf6;
  --good: #1b7a4b; --good-soft: #e2f3e9; --bad: #b23b3b; --bad-soft: #f9e5e5; --warn-soft: #fff2d1; color-scheme: light }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent }
html, body { height: 100% }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 17px; line-height: 1.5 }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }
button, select, input { font: inherit; color: inherit }
button { cursor: pointer; touch-action: manipulation }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
[hidden] { display: none !important }

.top { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5 }
.top .in { max-width: 640px; margin: 0 auto; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 10px; align-items: center; min-height: 54px }
.top h1 { font-size: 1.05rem; font-weight: 700; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.top .sub { display: block; font-size: .75rem; font-weight: 400; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.ib { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; min-width: 42px; height: 42px; padding: 0 12px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: .9rem; font-weight: 500 }
.ib.on { background: var(--accent); border-color: var(--accent); color: #fff }
.ib svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }

.page { max-width: 640px; margin: 0 auto; padding-block: 14px calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 20px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }

nav.bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); z-index: 6; padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)) }
nav.bar .in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); height: var(--nav-h) }
nav.bar button { border: 0; background: none; color: var(--muted); font-size: .72rem; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 0 }
nav.bar button svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round }
nav.bar button[aria-current="true"] { color: var(--accent); font-weight: 600 }
nav.bar button b { position: absolute; margin-left: 34px; margin-top: -34px; background: var(--bad); color: #fff; font-size: .65rem; border-radius: 999px; padding: 0 5px; line-height: 1.5 }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 18px; line-height: 1.3; font-weight: 500; min-height: 46px }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff }
.btn.wide { width: 100%; font-size: 1.05rem; font-weight: 600; min-height: 52px }
.btn.danger { color: var(--bad) }
.btn:disabled { opacity: .5; cursor: default }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; min-width: 0 }
.stack { display: flex; flex-direction: column; gap: 12px }
h2 { font-size: 1rem; margin: 0 0 8px; font-weight: 700 }
.hint { color: var(--muted); font-size: .88rem; margin: 0 }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface) }
.seg button { border: 0; background: none; padding: 11px 6px; font-weight: 500; font-size: .95rem }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff }
.chips { display: flex; flex-wrap: wrap; gap: 8px }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-size: .92rem; display: inline-flex; gap: 6px; align-items: baseline; min-height: 40px }
.chip .n { color: var(--muted); font-size: .8rem }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff } .chip[aria-pressed="true"] .n { color: rgba(255,255,255,.8) }
.search { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; min-height: 46px }
.search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 1rem; padding: 10px 0 }
.search svg { width: 18px; height: 18px; stroke: var(--muted); fill: none; stroke-width: 2; flex: none }
.search button { border: 0; background: none; color: var(--muted); padding: 6px }

/* question */
.q { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; min-width: 0 }
.qh { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; color: var(--muted); font-size: .78rem; margin-bottom: 8px }
.qh .num { color: var(--accent); font-weight: 700 }
.qt { font-weight: 600; font-size: 1.05rem; line-height: 1.45; margin: 0 0 12px; overflow-wrap: anywhere }
.opts { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none }
.opt { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); text-align: left; width: 100%; line-height: 1.4; overflow-wrap: anywhere; min-height: 48px; font-size: 1rem }
.opt .let { flex: none; width: 1.8em; height: 1.8em; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; font-size: .82rem; color: var(--muted) }
.opt.sel { border-color: var(--accent); background: var(--accent-soft) } .opt.sel .let { background: var(--accent); border-color: var(--accent); color: #fff }
.opt.ok { background: var(--good-soft); border-color: var(--good) } .opt.ok .let { background: var(--good); border-color: var(--good); color: #fff }
.opt.bad { background: var(--bad-soft); border-color: var(--bad) } .opt.bad .let { background: var(--bad); border-color: var(--bad); color: #fff }
.opt:disabled { cursor: default }
.reveal { margin-top: 10px; width: 100% }
.verdict { font-weight: 700 } .verdict.good { color: var(--good) } .verdict.bad { color: var(--bad) }
.fb { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 12px; font-size: .95rem }
.fb .m { color: var(--muted); font-size: .85rem }
.sticky-next { position: sticky; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 10px); margin-top: 12px }
.prog { display: flex; gap: 12px; align-items: center; font-size: .85rem; color: var(--muted); margin-bottom: 8px }
.prog b { color: var(--fg) }
.pbar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 12px }
.pbar i { display: block; height: 100%; background: var(--accent); width: 0 }
.grid { display: flex; flex-wrap: wrap; gap: 6px }
.grid button { width: 40px; height: 36px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: .85rem; padding: 0 }
.grid button.done { background: var(--accent-soft); border-color: var(--accent) } .grid button.cur { outline: 2px solid var(--accent); outline-offset: 1px }
.grid button.good { background: var(--good-soft); border-color: var(--good) } .grid button.wrong { background: var(--bad-soft); border-color: var(--bad) }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: .78rem; color: var(--muted) }
.tile b { display: block; font-size: 1.5rem; color: var(--fg); font-weight: 700; line-height: 1.2 } .tile b.g { color: var(--good) } .tile b.r { color: var(--bad) }
.ring { width: 120px; height: 120px; margin: 0 auto } .ring text { font-family: var(--body); fill: var(--fg) }
.confirm { background: var(--warn-soft); border-radius: 12px; padding: 12px 14px; font-size: .95rem; display: flex; flex-wrap: wrap; gap: 10px; align-items: center }
.empty { color: var(--muted); text-align: center; padding: 30px 10px }
.sync { font-size: .72rem; color: var(--muted) }
.mist { display: flex; gap: 10px; align-items: center; justify-content: space-between }
label.sw { display: flex; align-items: center; gap: 10px; min-height: 44px }
label.sw input { width: 22px; height: 22px }
select { padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); min-height: 46px; max-width: 100% }
@media (prefers-reduced-motion: no-preference) { .opt { transition: background .12s, border-color .12s } .pbar i { transition: width .3s } }
</style>

<div class="top"><div class="in">
  <h1 id="title">რეზიდენტურის ტესტები<span class="sub" id="subtitle">იტვირთება…</span></h1>
  <button class="ib" id="themeBtn" type="button" aria-label="თემა" title="თემა: ავტო / მუქი / ნათელი"><svg viewBox="0 0 24 24" id="themeIco"></svg></button>
  <button class="ib" id="filterBtn" type="button" aria-label="ფილტრი"><svg viewBox="0 0 24 24"><path d="M3 5h18M6 12h12M10 19h4"/></svg><span id="filterCount"></span></button>
</div></div>

<main class="page" id="page"></main>

<nav class="bar" aria-label="რეჟიმი"><div class="in">
  <button type="button" id="nRead" aria-current="true"><svg viewBox="0 0 24 24"><path d="M4 5h6a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H4zM20 5h-6a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h7z"/></svg>კითხვა</button>
  <button type="button" id="nTest" aria-current="false"><svg viewBox="0 0 24 24"><path d="M9 11l3 3 8-8M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>ტესტი</button>
  <button type="button" id="nMist" aria-current="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>შეცდომები<b id="mistBadge" hidden></b></button>
  <button type="button" id="nStats" aria-current="false"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>სტატისტიკა</button>
</div></nav>

<script>
(function () {
  const LET = 'აბგდევზთიკლმნოპჟრსტუფქღყშჩცძწჭხჯჰ';
  const YEARS = [[1, 'I წელი'], [2, 'II წელი'], [3, 'III წელი'], [0, 'წლის გარეშე']];
  const PAGE = 30;
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]] } return a };

  let BANK = [], byN = new Map(), topics = [];
  // U: saved state. wrong[n] = times wrong, right[n] = times right, history = tests, prefs = filters and options
  let U = { wrong: {}, right: {}, history: [], prefs: { years: [], topics: [], hide: false, count: 20, check: 'now', shuffle: true } };
  let view = 'read', filterOpen = false, search = '', shown = PAGE, order = null, revealed = new Set(), picks = new Map(), test = null;

  /* ---------- theme override (per viewer, kept in this browser) ---------- */
  const ICO = { auto: '<circle cx="12" cy="12" r="9"/><path d="M12 3v18M12 3a9 9 0 0 1 0 18" fill="currentColor"/>', dark: '<path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/>', light: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>' };
  function applyTheme(t) { const r = document.documentElement; if (t === 'auto') r.removeAttribute('data-force'); else r.setAttribute('data-force', t); $('themeIco').innerHTML = ICO[t] }
  let theme = 'auto'; try { theme = localStorage.getItem('rt-theme') || 'auto' } catch (e) {} if (!ICO[theme]) theme = 'auto'; applyTheme(theme);
  $('themeBtn').onclick = () => { theme = theme === 'auto' ? 'dark' : theme === 'dark' ? 'light' : 'auto'; try { localStorage.setItem('rt-theme', theme) } catch (e) {} applyTheme(theme) };

  /* ---------- storage ---------- */
  const store = { col: null, mode: 'local', dirty: new Set(), timer: null, chain: Promise.resolve() };
  const DOCS = ['answers', 'history', 'prefs'];
  const body = n => n === 'answers' ? { wrong: U.wrong, right: U.right } : n === 'history' ? { list: U.history.slice(-100) } : { ...U.prefs };
  const apply = (n, b) => { if (!b) return; if (n === 'answers') { U.wrong = b.wrong || {}; U.right = b.right || {} } else if (n === 'history') U.history = b.list || []; else Object.assign(U.prefs, b) };
  async function initStore() {
    let db = null, user = null;
    try { if (window.claude && claude.use) [db, user] = await Promise.all([claude.use('db'), claude.use('user')]) } catch (e) {}
    const uid = user ? await user.id().catch(() => null) : null;
    const loc = (() => { try { const v = localStorage.getItem('rt'); return v ? JSON.parse(v) : null } catch (e) { return null } })();
    if (db && uid) {
      store.col = db.collection('data/users/' + uid); store.mode = 'cloud';
      const snaps = await Promise.all(DOCS.map(d => store.col.doc(d).get().catch(() => null)));
      const any = snaps.some(s => s && s.exists);
      snaps.forEach((s, i) => { if (s && s.exists) apply(DOCS[i], s.data()) });
      if (!any && loc) { applyLocal(loc); DOCS.forEach(dirty) }
    } else if (loc) applyLocal(loc);
  }
  function applyLocal(loc) { U.wrong = loc.wrong || {}; U.right = loc.right || {}; U.history = loc.history || []; Object.assign(U.prefs, loc.prefs || {}) }
  function dirty(n) { store.dirty.add(n); clearTimeout(store.timer); store.timer = setTimeout(flush, 1200) }
  function flush() {
    clearTimeout(store.timer); if (!store.dirty.size) return;
    const names = [...store.dirty]; store.dirty.clear();
    try { localStorage.setItem('rt', JSON.stringify(U)) } catch (e) {}
    if (store.mode !== 'cloud') return;
    store.chain = store.chain.then(async () => { for (const n of names) { try { await store.col.doc(n).set(body(n)) } catch (e) { if (e && (e.code === 'invalid_argument' || e.code === 'not_granted' || e.code === 'revoked')) { store.mode = 'local'; paintSub(); return } store.dirty.add(n); paintSub('შენახვა ვერ მოხერხდა, ვცდი ხელახლა'); clearTimeout(store.timer); store.timer = setTimeout(flush, 15000); return } } paintSub() });
  }
  document.addEventListener('visibilitychange', () => { if (document.hidden) flush() }); window.addEventListener('pagehide', flush);

  /* ---------- filter ---------- */
  const P = () => U.prefs;
  const inFilter = q => (!P().years.length || P().years.includes(q.y)) && (!P().topics.length || P().topics.includes(q.t));
  const matchText = q => { const t = search.trim().toLowerCase(); return !t || q.q.toLowerCase().includes(t) || q.opts.some(o => o.toLowerCase().includes(t)) || String(q.n) === t };
  function pool() { let p = BANK.filter(q => inFilter(q) && matchText(q)); if (order) { const pos = new Map(order.map((n, i) => [n, i])); p = p.slice().sort((a, b) => pos.get(a.n) - pos.get(b.n)) } return p }
  function filterLabel() { const y = P().years.length ? P().years.map(v => YEARS.find(x => x[0] === v)[1]).join(', ') : 'ყველა წელი'; const t = P().topics.length ? (P().topics.length > 2 ? P().topics.length + ' თემა' : P().topics.join(', ')) : 'ყველა თემა'; return y + ' · ' + t }
  function paintSub(msg) {
    const n = BANK.filter(inFilter).length;
    $('subtitle').textContent = msg || `${filterLabel()} · ${n} კითხვა · ${store.mode === 'cloud' ? 'ინახება ანგარიშზე' : 'ინახება ბრაუზერში'}`;
    const fc = P().years.length + P().topics.length; $('filterCount').textContent = fc ? fc : ''; $('filterBtn').classList.toggle('on', fc > 0);
    const m = Object.keys(U.wrong).filter(n => U.wrong[n] > (U.right[n] || 0) * 0 && byN.has(+n)).length; $('mistBadge').hidden = !m; $('mistBadge').textContent = m;
  }

  /* ---------- nav ---------- */
  function go(v) { view = v; filterOpen = false; ['Read', 'Test', 'Mist', 'Stats'].forEach(x => $('n' + x).setAttribute('aria-current', v === x.toLowerCase())); render(); window.scrollTo({ top: 0 }) }
  $('nRead').onclick = () => go('read'); $('nTest').onclick = () => go('test'); $('nMist').onclick = () => go('mist'); $('nStats').onclick = () => go('stats');
  $('filterBtn').onclick = () => { filterOpen = !filterOpen; render(); window.scrollTo({ top: 0 }) };
  function render() {
    paintSub(); const pg = $('page'); pg.innerHTML = '';
    if (filterOpen) return renderFilter(pg);
    if (view === 'read') renderRead(pg); else if (view === 'test') renderTest(pg); else if (view === 'mist') renderMist(pg); else renderStats(pg);
  }

  /* ---------- FILTER ---------- */
  function renderFilter(pg) {
    const cnt = f => BANK.filter(f).length;
    pg.innerHTML = `<div class="stack">
      <div class="card"><h2>წელი</h2><div class="chips" id="yc">${YEARS.map(([v, n]) => `<button type="button" class="chip" data-y="${v}" aria-pressed="${P().years.includes(v)}"><span>${n}</span><span class="n">${cnt(q => q.y === v && (!P().topics.length || P().topics.includes(q.t)))}</span></button>`).join('')}</div></div>
      <div class="card"><h2>თემა</h2><div class="chips" id="tc">${topics.map(t => `<button type="button" class="chip" data-t="${esc(t)}" aria-pressed="${P().topics.includes(t)}"><span>${esc(t)}</span><span class="n">${cnt(q => q.t === t && (!P().years.length || P().years.includes(q.y)))}</span></button>`).join('')}</div></div>
      <p class="hint">არცერთი არჩეული = ყველა. ფილტრი მოქმედებს კითხვაზეც და ტესტზეც.</p>

    if (k >= 1 && k <= q.opts.length) { const b = document.querySelector(`#qbox .opt[data-i="${k - 1}"]`); if (b && b.tagName === 'BUTTON') b.click() }
    else if (e.key === 'Enter' || e.key === 'ArrowRight') { const n = $('next'); if (n) n.click() }
    else if (e.key === 'ArrowLeft') { const p = $('prev'); if (p && !p.disabled) p.click() }
  });

  /* ---------- boot ---------- */
  fetch('bank.json').then(r => { if (!r.ok) throw new Error(r.status); return r.json() }).then(async data => {
    BANK = data; BANK.forEach(q => byN.set(q.n, q));
    const tc = {}; BANK.forEach(q => tc[q.t] = (tc[q.t] || 0) + 1); topics = Object.keys(tc).sort((a, b) => tc[b] - tc[a]);
    await initStore(); render();
  }).catch(err => { $('page').innerHTML = '<p class="empty">კითხვების ჩატვირთვა ვერ მოხერხდა (' + esc(err.message) + '). განაახლეთ გვერდი.</p>' });
})();
</script>

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}) });
}
</script>
